<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>バナイベ開催検索＆早見表</title>
<style>
body{
  font-family:"Hiragino Sans","Meiryo",sans-serif;
  background:#fff7fb;
  padding:20px;
  text-align:center;
}
h1{ margin:20px 0; color:#d63384; }

.box{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  margin-bottom:25px;
}

button{
  padding:6px 14px;
  border:none;
  border-radius:8px;
  background:#ff66a3;
  color:white;
  cursor:pointer;
}
button:hover{ background:#ff3385; }

select{
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-left:10px;
}

.year-nav{ font-size:20px; margin-bottom:10px; }

.result{
  margin-top:15px;
  font-weight:bold;
  color:#c2185b;
}

table{
  margin:20px auto;
  border-collapse:collapse;
  width:100%;
  max-width:1000px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
}
th{ background:#ffe0f0; }

.section-title{
  font-size:18px;
  margin-top:30px;
  color:#b03060;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.note{
  font-size:13px;
  color:#666;
}

.search-title{
  font-size:24px;
  font-weight:bold;
  color:#b03060;
  margin:10px 0 12px 0;
}

.example{
  font-size:12px;
  color:#888;
  margin-top:6px;
  line-height:1.6;
}

  .top-notice{
  background:#ff4d4f;
  color:white;
  padding:14px 20px;
  border-radius:14px;
  margin-bottom:20px;
  font-weight:bold;
  line-height:1.7;
  box-shadow:0 4px 12px rgba(255,0,0,0.15);
  border:2px solid #ff9a9c;
}
</style>
</head>
<body>
<div class="top-notice">
📢 2026/6/23 〜 6/29 のトップバナーチャレンジは、
『IRIAM甲子園』のため<br>
<strong>2026/6/30 〜 7/6</strong> に延期して開催！<br><br>

対象：
「2026/05/25 04:00:00〜2026/06/01 03:59:59」に
初配信（デビュー）したライバーさん
</div>
<div class="box">

  <div class="note">
  ※午前4:00より前に配信開始した場合は「前日扱い」になります
  </div>

  <div class="example">
  例①：2月22日 3:00開始 → 2月21日扱い<br>
  例②：2月22日 6:00開始 → 2月22日扱い
  </div>

  <br>

<div class="search-title">
🌸 デビュー日検索
</div>


<input type="date" id="debutDateTime">
<button onclick="searchEvent()">検索</button>
<div class="result" id="result"></div>

</div>

<div class="year-nav">
<button onclick="changeYear(-1)">◀</button>
<span id="displayYear"></span>年
<button onclick="changeYear(1)">▶</button>
</div>

<h1>トップバナーチャレンジ開催早見表</h1>

<div id="tables"></div>

<script>
let currentYear = new Date().getFullYear();
let currentHalf = "first";
let selectedMonth = "all";

function init(){
updateYearDisplay();
setDefaultDateTime();
generateTables();
}

function updateYearDisplay(){
document.getElementById("displayYear").innerText=currentYear;
}

function setDefaultDateTime(){
  let today = new Date();
  let d = new Date(currentYear, today.getMonth(), today.getDate());

  let yyyy = d.getFullYear();
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let dd = String(d.getDate()).padStart(2, '0');

  document.getElementById("debutDateTime").value = `${yyyy}-${mm}-${dd}`;
}

function changeYear(diff){
currentYear+=diff;
updateYearDisplay();
setDefaultDateTime();
generateTables();
document.getElementById("result").innerHTML="";
}

function changeHalf(value){
currentHalf=value;
selectedMonth="all";
generateTables();
}

function changeMonth(value){
selectedMonth=value;
generateTables();
}

function isLeapYear(y){
return (y%4===0 && y%100!==0) || y%400===0;
}

function firstTuesday(year,month){
let d=new Date(year,month-1,1);
while(d.getDay()!==2){
d.setDate(d.getDate()+1);
}
return d;
}

function formatDate(d){
return (d.getMonth()+1)+"/"+d.getDate();
}

function getDebutRanges(year,month){
let days = new Date(year,month,0).getDate();
let leap = isLeapYear(year);

if([1,3,5,7,8,10,12].includes(month)){
return [[1,8],[9,16],[17,24],[25,days]];
}

if([4,6,9,11].includes(month)){
return [[1,8],[9,16],[17,23],[24,days]];
}

if(month===2){
if(leap){
return [[1,9],[10,16],[17,23],[24,days]];
}
return [[1,8],[9,15],[16,22],[23,days]];
}
}

function generateTables(){

let container=document.getElementById("tables");
container.innerHTML="";

let startMonth = currentHalf==="first"?1:7;
let endMonth   = currentHalf==="first"?6:12;
let halfLabel  = currentHalf==="first"?"前半（1〜6月デビュー）":"後半（7〜12月デビュー）";

let controls = `
<div>
<button onclick="changeHalf('first')">前半</button>
<button onclick="changeHalf('second')">後半</button>
<select onchange="changeMonth(this.value)">
<option value="all">全月表示</option>
${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join("")}
</select>
</div>
`;

let html=`<div class="section-title">
${currentYear}年 ${halfLabel}
${controls}
</div>`;

html+=`<table>
<tr>
<th>初配信日時</th>
<th>参加可能週</th>
<th>開催期間</th>
</tr>`;

for(let m=startMonth; m<=endMonth; m++){

if(selectedMonth!=="all" && parseInt(selectedMonth)!==m) continue;

let ranges=getDebutRanges(currentYear,m);
let nextMonth=m+1;
let eventYear=currentYear;
if(nextMonth===13){nextMonth=1;eventYear++;}

let firstTue=firstTuesday(eventYear,nextMonth);

ranges.forEach((r,i)=>{

let start=new Date(firstTue);
start.setDate(start.getDate()+i*7);
let end=new Date(start);
end.setDate(end.getDate()+6);

html+=`<tr>
<td>${m}月${r[0]}日 4:00 ～ ${m}月${r[1]}日 3:59</td>
<td>${nextMonth}月${i+1}週目</td>
<td>${formatDate(start)}〜${formatDate(end)}</td>
</tr>`;
});
}

html+="</table>";
container.innerHTML=html;
}

function searchEvent(){

let input=document.getElementById("debutDateTime").value;
if(!input) return;

let debut=new Date(input);

let y=debut.getFullYear();
let m=debut.getMonth()+1;
let d=debut.getDate();

let ranges=getDebutRanges(y,m);

let week=1;
ranges.forEach((r,i)=>{
if(d>=r[0] && d<=r[1]){
week=i+1;
}
});

let nextMonth=m+1;
let eventYear=y;
if(nextMonth===13){nextMonth=1;eventYear++;}

let firstTue=firstTuesday(eventYear,nextMonth);

let start=new Date(firstTue);
start.setDate(start.getDate()+(week-1)*7);
let end=new Date(start);
end.setDate(end.getDate()+6);

document.getElementById("result").innerHTML=
`あなたの参加可能週は<br>
<span style="font-size:20px;">
${nextMonth}月${week}週目<br>
${formatDate(start)}〜${formatDate(end)}
</span>`;
}

init();
</script>

</body>
</html>
