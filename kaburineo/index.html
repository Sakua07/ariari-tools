<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>重複整理ツール</title>
<style>
  body {
    font-family: sans-serif;
    background: #f5f5f5;
    padding: 20px;
  }
  textarea {
    width: 100%;
    height: 120px;
    font-size: 16px;
    padding: 10px;
  }
  button {
    margin: 5px 5px 5px 0;
    padding: 8px 15px;
    font-size: 14px;
    cursor: pointer;
  }
  #output {
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    white-space: pre-wrap;
  }
  .highlight {
    background: yellow;
  }
</style>
</head>
<body>

<h2>重複整理ツール（改行なしOK空白は必要）</h2>

<textarea id="input" placeholder="例：
A 3個 A B ×2 B C"></textarea>

<br>

<button onclick="highlightDuplicates()">重複をマーク</button>
<button onclick="removeDuplicates()">1つにまとめる</button>
<button onclick="resetAll()">リセット</button>

<br>

<input id="filename" placeholder="画像名">
<button onclick="saveImage()">画像保存</button>

<div id="output"></div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
// 個数表記削除
function cleanText(text) {
  return text
    .replace(/\d+個/g, "")
    .replace(/[×xX]\d+/g, "")
    .trim();
}

// 入力を分割（改行なし対応）
function splitInput(text) {
  return text
    .split(/[\s,、]+/) // スペース・カンマ対応
    .map(t => t.trim())
    .filter(t => t !== "");
}

// 重複マーク
function highlightDuplicates() {
  const input = document.getElementById("input").value;
  const items = splitInput(input).map(cleanText);

  const count = {};
  items.forEach(i => count[i] = (count[i] || 0) + 1);

  let resultHTML = "";

  items.forEach(i => {
    if (count[i] > 1) {
      resultHTML += `<span class="highlight">${i}</span> `;
    } else {
      resultHTML += i + " ";
    }
  });

  document.getElementById("output").innerHTML = resultHTML;
}

// 重複削除
function removeDuplicates() {
  const input = document.getElementById("input").value;
  const items = splitInput(input).map(cleanText);

  const unique = [...new Set(items)];

  const outputText =
    unique.join("\n") +
    "\n\n種類数：" + unique.length;

  document.getElementById("output").textContent = outputText;
}

// リセット
function resetAll() {
  input.value = "";
  output.textContent = "";
  filename.value = "";
}

// 画像保存
function saveImage() {
  const text = document.getElementById("output").innerText;
  if (!text) return alert("先に実行してね");

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const lines = text.split("\n");
  const lineHeight = 30;

  canvas.width = 400;
  canvas.height = lines.length * lineHeight + 20;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#000";
  ctx.font = "20px sans-serif";

  lines.forEach((line, i) => {
    ctx.fillText(line, 10, 30 + i * lineHeight);
  });

  const name = filename.value || "list";

  const link = document.createElement("a");
  link.download = name + ".png";
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
