<script>
let db;
let songs=[];
let editIndex=-1;
/* ---------- 🍏変更点 ---------- */
const DB_NAME="iriamSongsDB_v35";
const STORE="songs";

/* ---------- IndexedDB ---------- */
function initDB(){
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=e=>{
    db=e.target.result;
    db.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
  };
  req.onsuccess=e=>{
    db=e.target.result;
    loadSongs();
  };
}

function saveDB(){
  const tx=db.transaction(STORE,"readwrite");
  const store=tx.objectStore(STORE);
  store.clear();
  songs.forEach(s=>store.add(s));
}

function loadSongs(){
  const tx=db.transaction(STORE,"readonly");
  const store=tx.objectStore(STORE);
  const req=store.getAll();
  req.onsuccess=()=>{
    songs=req.result||[];
    insertSampleSongsIfEmpty();
    render(songs);
  };
}

/* ---------- 描画 ---------- */
function render(list){
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  list.forEach(song=>{
    const realIndex = songs.indexOf(song);
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${song.code}</td>
      <td>${song.title}</td>
      <td>${song.artist}</td>
      <td>${song.author}</td>
      <td><span class="badge ${song.rights}">${song.rights.toUpperCase()}</span></td>
      <td>
        <button class="btn edit" onclick="edit(${realIndex})">編集</button>
        <button class="btn delete" onclick="removeSong(${realIndex})">削除</button>
        <button class="btn submit" onclick="submitIRIAM(${realIndex})">申請</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

/* ---------- 追加 / 編集 ---------- */
function addOrUpdate(){
  const song={
    code:code.value.trim(),
    title:title.value.trim(),
    artist:artist.value.trim(),
    author:author.value.trim(),
    rights:rights.value
  };
  if(!song.code||!song.title) return alert("未入力あり");

  editIndex===-1 ? songs.push(song) : songs[editIndex]=song;
  editIndex=-1;
  saveDB();
  render(songs);
  clearForm();
}

function edit(i){
  const s=songs[i];
  code.value=s.code;
  title.value=s.title;
  artist.value=s.artist;
  author.value=s.author;
  rights.value=s.rights;
  editIndex=i;
}

function clearForm(){
  code.value=title.value=artist.value=author.value="";
  rights.value="jasrac";
}

function removeSong(i){
  if(confirm("削除しますか？")){
    songs.splice(i,1);
    saveDB();
    render(songs);
  }
}

/* ---------- 検索 ---------- */
function searchSongs(){
  const k=search.value.toLowerCase();
  render(
    songs.filter(s =>
      s.title.toLowerCase().includes(k) ||
      s.artist.toLowerCase().includes(k)||
 s.author.toLowerCase().includes(k)
    )
  );
}

/* ---------- 申請 ---------- */
function submitIRIAM(i){
  const s=songs[i];
  const url=`https://www.iriam.app/music-use-request?platform=${s.rights}`
    +`&work_code=${encodeURIComponent(s.code)}`
    +`&title=${encodeURIComponent(s.title)}`
    +`&artist=${encodeURIComponent(s.artist)}`
    +`&author=${encodeURIComponent(s.author)}`;

  navigator.clipboard.writeText(
    `${s.code} ${s.title} ${s.artist} ${s.author}`
  );

window.open(url, "_blank");
}

function backupJSON(){
  const blob=new Blob([JSON.stringify(songs,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="iriam_songs_backup.json";
  a.click();
}

function restoreJSON(e){
  const file=e.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    songs=JSON.parse(r.result);
    saveDB();
    render(songs);
  };
  r.readAsText(file);
}

initDB();
