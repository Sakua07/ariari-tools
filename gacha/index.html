<!-- アプリ化モーダルダイアログ -->
<div id="pwaModal">
  <div id="pwaContent">
    <h3>📲 ホーム画面への追加方法</h3>
    <div id="pwaInstruction" style="text-align:left; font-size:14px; line-height:1.6;"></div>
    <button id="closePwaBtn">閉じる</button>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   純粋な文字のみを安全に取り出す関数（2段階HTMLデコード＆タグ全除去）
   --------------------------------------------------------- */
function cleanTextOnly(input) {
  if (input === null || input === undefined) return "";
  let str = String(input);
  let doc = new DOMParser();
  for (let i = 0; i < 2; i++) {
    str = doc.parseFromString(str, 'text/html').body.textContent || "";
    str = str.replace(/<[^>]*>/g, "");
  }
  return str.trim();
}

function escapeHTML(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* どんな崩れた過去履歴データでも「名前」「レア度」「本文」に完全分離する強力解析関数 */
function sanitizeHistoryEntry(h) {
  let name = "名無し", rarity = "N", text = "", link = "";

  if (typeof h === "string") {
    let trimmed = h.trim();
    if (trimmed.startsWith("{") && trimmed.endsWith("}")) {
      try { h = JSON.parse(trimmed); } catch(e) {}
    }
  }

  if (typeof h === "object" && h !== null) {
    name = h.name || name;
    rarity = h.rarity || rarity;
    text = h.text || "";
    link = h.link || "";
  } else if (typeof h === "string") {
    if (h.includes("|")) {
      let parts = h.split("|");
      name = parts[0] || name;
      rarity = parts[1] || rarity;
      text = parts.slice(2).join("|");
    } else {
      text = h;
    }
  }

  name = cleanTextOnly(name) || "名無し";
  rarity = cleanTextOnly(rarity).toUpperCase();
  text = cleanTextOnly(text);
  link = cleanTextOnly(link);

  const validRarities = ["N", "R", "SR", "SSR", "UR", "LR"];
  if (!validRarities.includes(rarity)) {
    let foundR = validRarities.find(r => rarity.includes(r));
    rarity = foundR || "N";
  }

  // 本文の先頭に付着したレア度記号や箇条書き文字（「・SSR 」等）を全消去
  validRarities.forEach(r => {
    let re = new RegExp(`^[・\\s]*([\\[【]?${r}[\\]】]?)?\\s*`, "i");
    text = text.replace(re, "");
  });
  text = text.replace(/^[・\s]+/, "").trim();

  return { name, rarity, text, link };
}

/* ---------------------------------------------------------
   IndexedDB セットアップ
   --------------------------------------------------------- */
let db;
const DB_NAME = "gachaDB";
const STORE_NAME = "gachaStore";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onerror = e => reject(e);
    req.onsuccess = e => {
      db = e.target.result;
      resolve(db);
    };
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
  });
}
function saveToDB(key, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    store.put({ key, value });
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
function loadFromDB(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = reject;
  });
}

/* ---------------------------------------------------------
   データ管理とガチャカテゴリ処理
   --------------------------------------------------------- */
let ITEMS = [], history = [], playerNames = [], historyPlayers = [];
let gachaCategories = ["デフォルトガチャ"];
let currentGacha = "デフォルトガチャ";

const historyEl = document.getElementById("history");
const gachaSelect = document.getElementById("gachaSelect");

const probR = document.getElementById("probR");
const probSR = document.getElementById("probSR");
const probSSR = document.getElementById("probSSR");
const probUR = document.getElementById("probUR");
const probLR = document.getElementById("probLR");

/* 確率の保存と読み込み */
async function saveProbabilities() {
  const probs = {
    R: parseFloat(probR.value) || 0,
    SR: parseFloat(probSR.value) || 0,
    SSR: parseFloat(probSSR.value) || 0,
    UR: parseFloat(probUR.value) || 0,
    LR: parseFloat(probLR.value) || 0
  };
  await saveToDB("gacha_probs_" + currentGacha, probs);
}

async function loadProbabilities() {
  const probs = await loadFromDB("gacha_probs_" + currentGacha);
  if (probs) {
    probR.value = probs.R ?? 10;
    probSR.value = probs.SR ?? 5;
    probSSR.value = probs.SSR ?? 2;
    probUR.value = probs.UR ?? 1;
    probLR.value = probs.LR ?? 0.1;
  } else {
    probR.value = 10;
    probSR.value = 5;
    probSSR.value = 2;
    probUR.value = 1;
    probLR.value = 0.1;
  }
}

[probR, probSR, probSSR, probUR, probLR].forEach(input => {
  input.addEventListener('change', saveProbabilities);
  input.addEventListener('input', saveProbabilities);
});

async function loadData() {
  await openDB();

  gachaCategories = (await loadFromDB("gacha_categories")) || ["デフォルトガチャ"];
  currentGacha = (await loadFromDB("gacha_currentCategory")) || gachaCategories[0];

  const oldItems = await loadFromDB("gacha_ITEMS");
  if (oldItems && oldItems.length > 0) {
    await saveToDB("gacha_ITEMS_デフォルトガチャ", oldItems);
    await saveToDB("gacha_ITEMS", null);
  }
  const oldHistory = await loadFromDB("gacha_history");
  if (oldHistory && oldHistory.length > 0) {
    await saveToDB("gacha_history_デフォルトガチャ", oldHistory);
    await saveToDB("gacha_history", null);
  }

  playerNames = (await loadFromDB("gacha_playerNames")) || [];
  historyPlayers = (await loadFromDB("gacha_historyPlayers")) || [];

  updateGachaSelectDropdown();
  await switchGachaCategory(currentGacha);

  nameSelect.innerHTML = '<option value="">選択</option>';
  playerNames.forEach(n => {
    let clean = cleanTextOnly(n);
    if (!clean) return;
    let o = document.createElement("option");
    o.value = clean; o.textContent = clean;
    nameSelect.appendChild(o);
  });
  
  historyFilter.innerHTML = '<option value="">全員</option>';
  historyPlayers.forEach(n => {
    let clean = cleanTextOnly(n);
    if (!clean) return;
    let o = document.createElement("option");
    o.value = clean; o.textContent = clean;
    historyFilter.appendChild(o);
  });
}

function updateGachaSelectDropdown() {
  gachaSelect.innerHTML = "";
  gachaCategories.forEach(cat => {
    let o = document.createElement("option");
    o.value = cat;
    o.textContent = cat;
    if (cat === currentGacha) o.selected = true;
    gachaSelect.appendChild(o);
  });
}

async function switchGachaCategory(catName) {
  currentGacha = catName;
  await saveToDB("gacha_currentCategory", currentGacha);

  ITEMS = (await loadFromDB("gacha_ITEMS_" + currentGacha)) || [];
  let rawHistory = (await loadFromDB("gacha_history_" + currentGacha)) || [];

  // 全自動クレンジング＆完全修復
  history = rawHistory.map(h => sanitizeHistoryEntry(h)).filter(h => h.text !== "");
  await saveToDB("gacha_history_" + currentGacha, history);

  await loadProbabilities();

  results.innerHTML = "";
  showHistory();
}

gachaSelect.addEventListener('change', async (e) => {
  await switchGachaCategory(e.target.value);
});

addGachaCategoryBtn.onclick = async () => {
  let name = prompt("新しいガチャの種類名を入力してください (例: イベント限定ガチャ)");
  if (!name) return;
  name = cleanTextOnly(name);
  if (gachaCategories.includes(name)) {
    alert("同じ名前のガチャが既に存在します");
    return;
  }
  gachaCategories.push(name);
  await saveToDB("gacha_categories", gachaCategories);
  currentGacha = name;
  updateGachaSelectDropdown();
  await switchGachaCategory(currentGacha);
  await saveProbabilities();
  alert("「" + name + "」を追加して切替えました！");
};

deleteGachaCategoryBtn.onclick = async () => {
  if (gachaCategories.length <= 1) {
    alert("これ以上ガチャを削除することはできません");
    return;
  }
  if (confirm("現在の「" + currentGacha + "」とその内容・履歴・確率設定を削除しますか？")) {
    const target = currentGacha;
    gachaCategories = gachaCategories.filter(c => c !== target);
    await saveToDB("gacha_categories", gachaCategories);
    await saveToDB("gacha_ITEMS_" + target, null);
    await saveToDB("gacha_history_" + target, null);
    await saveToDB("gacha_probs_" + target, null);
    currentGacha = gachaCategories[0];
    updateGachaSelectDropdown();
    await switchGachaCategory(currentGacha);
    alert("削除完了しました");
  }
};

/* データリセット（中身・履歴・確率設定をすべて初期状態に復元） */
async function resetData() {
  if (confirm("現在選択中の「" + currentGacha + "」の中身、履歴、確率設定をリセットしますか？")) {
    ITEMS = []; history = [];
    await saveToDB("gacha_ITEMS_" + currentGacha, ITEMS);
    await saveToDB("gacha_history_" + currentGacha, history);
    
    // 確率数値をデフォルト値に初期化
    probR.value = 10;
    probSR.value = 5;
    probSSR.value = 2;
    probUR.value = 1;
    probLR.value = 0.1;
    await saveProbabilities();

    results.innerHTML=""; historyEl.innerHTML="";
    alert("「" + currentGacha + "」をリセットしました！");
  }
}
resetBtn.onclick = resetData;

window.addEventListener('load', async () => {
  alertModal.style.display='flex';
  alertMessage.innerHTML="アリアリツールへようこそ！<br>いいねとリポストで応援してね！";
  await loadData();
});
closeAlertBtn.onclick = ()=>{alertModal.style.display='none';};

/* ■ ガチャ内容追加 */
addBtn.onclick = async () => {
  let rarity = addRarity.value,
      text = cleanTextOnly(addText.value),
      link = cleanTextOnly(addLink.value);
  if (!text) { alert("内容を入力してください"); return; }
  ITEMS.push({ rarity, text, link });
  await saveToDB("gacha_ITEMS_" + currentGacha, ITEMS);
  addText.value = ""; addLink.value = ""; addRarity.value = "N";
  alert("追加しました！（「" + currentGacha + "」に保存済）");
};

function renderItemsInAlert(){
  alertItems.innerHTML="";
  if(ITEMS.length===0){alertItems.innerHTML="<p>ガチャ内容がありません</p>";}
  else ITEMS.forEach((it,i)=>{
    let div=document.createElement("div");
    div.className="item";
    let cleanText = escapeHTML(cleanTextOnly(it.text));
    let cleanLink = it.link ? escapeHTML(cleanTextOnly(it.link)) : "";
    div.innerHTML=`<span class="pill ${it.rarity}">${it.rarity}</span>
      <span class="msg">${cleanText}${cleanLink ? ' ('+cleanLink+')' : ''}</span>
      <button onclick="editItem(${i})">編集</button>
      <button onclick="deleteItem(${i})">削除</button>`;
    alertItems.appendChild(div);
  });
  alertModal.style.display="flex";
}
showItemsBtn.onclick=()=>{renderItemsInAlert();};

async function editItem(i){
  let it=ITEMS[i],r=prompt("レア度:",it.rarity);if(r===null)return;
  r=r.toUpperCase();if(!["N","R","SR","SSR","UR","LR"].includes(r)){alert("無効なレア度");return;}
  let t=prompt("内容:",it.text);if(t===null)return;
  let l=prompt("リンク:",it.link);if(l===null)return;
  ITEMS[i]={rarity:r, text:cleanTextOnly(t), link:cleanTextOnly(l)};
  await saveToDB("gacha_ITEMS_" + currentGacha, ITEMS);
  renderItemsInAlert();
}
async function deleteItem(i){
  if(confirm("削除しますか？")){
    ITEMS.splice(i,1);
    await saveToDB("gacha_ITEMS_" + currentGacha, ITEMS);
    renderItemsInAlert();
  }
}

playerName.addEventListener('change', async ()=>{
  let val=cleanTextOnly(playerName.value);
  if(val&&!playerNames.includes(val)&&playerNames.length<30){
    playerNames.push(val);
    let o=document.createElement('option');
    o.value=val;o.textContent=val;
    nameSelect.appendChild(o);
  }
  if(val&&!historyPlayers.includes(val)){
    historyPlayers.push(val);
    let o=document.createElement('option');
    o.value=val;o.textContent=val;
    historyFilter.appendChild(o);
  }
  await saveToDB("gacha_playerNames", playerNames);
  await saveToDB("gacha_historyPlayers", historyPlayers);
});
nameSelect.addEventListener('change',()=>{
  playerName.value=nameSelect.value;
  historyFilter.value=nameSelect.value;
  showHistory();
});

function buildProbTable(){
  let pr=parseFloat(probR.value)||0,psr=parseFloat(probSR.value)||0,
      pssr=parseFloat(probSSR.value)||0,pur=parseFloat(probUR.value)||0,
      plr=parseFloat(probLR.value)||0;
  let sum=pr+psr+pssr+pur+plr;
  return {N:100-sum,R:pr,SR:psr,SSR:pssr,UR:pur,LR:plr};
}
function rollOnce(){
  if(ITEMS.length===0) return null;
  let p=buildProbTable(),rand=Math.random()*100,acc=0,r="N";
  for(let k of ["R","SR","SSR","UR","LR","N"]){acc+=p[k];if(rand<acc){r=k;break;}}
  let c=ITEMS.filter(it=>it.rarity===r);if(c.length===0)c=ITEMS;
  return c[Math.floor(Math.random()*c.length)];
}
function roll(times){
  if(ITEMS.length === 0) { 
    alert("ガチャ内容がありません"); 
    return;
  }
  let name=cleanTextOnly(playerName.value)||"名無し",arr=[];
  for(let i=0;i<times;i++){
    let r=rollOnce(); 
    if(r) arr.push(r);
  }
  showResults(name,arr);
  addHistory(name,arr);
}

function showResults(name,arr){
  results.innerHTML="";
  let counts={};
  arr.forEach(r=>{
    const cleanText = cleanTextOnly(r.text);
    const cleanLink = cleanTextOnly(r.link || "");
    const cleanRarity = cleanTextOnly(r.rarity || "N");
    const key = JSON.stringify([cleanRarity, cleanText, cleanLink]);
    counts[key] = (counts[key] || 0) + 1;
  });

  let text = cleanTextOnly(name) + "\n";
  for(let k in counts){
    let [rarity, textItem] = JSON.parse(k);
    text += "・" + rarity + "　" + textItem;
    if(counts[k] > 1) text += " ×" + counts[k];
    text += "\n";
  }
  text += "#アリアリツール";
  
  let div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `<span class="msg">${escapeHTML(text).replace(/\n/g,"<br>")}</span>`;
  results.append(div);
}

async function addHistory(name,arr){
  arr.forEach(r=>{
    history.unshift({
      name: cleanTextOnly(name), 
      rarity: cleanTextOnly(r.rarity), 
      text: cleanTextOnly(r.text)
    });
  });
  await saveToDB("gacha_history_" + currentGacha, history);
}

/* 修正：全員表示 */
function showHistory(){
  let filter = historyFilter.value;
  historyEl.innerHTML = "";
  let grouped = new Map();

  history.forEach(rawH => {
    let item = sanitizeHistoryEntry(rawH);
    if (!item.text) return;

    if (!filter || item.name === filter) {
      let key = JSON.stringify([item.name, item.rarity, item.text]);
      grouped.set(key, (grouped.get(key) || 0) + 1);
    }
  });

  grouped.forEach((count, keyStr) => {
    let [name, rarity, text] = JSON.parse(keyStr);
    let found = ITEMS.find(it => cleanTextOnly(it.text) === text);
    let link = (found && found.link) ? cleanTextOnly(found.link) : "";
    
    let countStr = count > 1 ? ` ×${count}` : "";
    let linkStr = link ? `<br><small style="color:#666;">URL: ${escapeHTML(link)}</small>` : "";
    
    let div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<span class="msg"><b>${escapeHTML(name)}</b><br>・<span class="pill ${rarity}">${rarity}</span> ${escapeHTML(text)}${countStr}${linkStr}</span>`;
    historyEl.appendChild(div);
  });
}
showHistoryBtn.onclick = showHistory;

/* 修正：全員コピー */
copyAllBtn.onclick = () => {
  const filter = historyFilter.value;
  let grouped = new Map();

  history.forEach(rawH => {
    let item = sanitizeHistoryEntry(rawH);
    if (!item.text) return;

    if (!filter || item.name === filter) {
      let key = JSON.stringify([item.name, item.rarity, item.text]);
      grouped.set(key, (grouped.get(key) || 0) + 1);
    }
  });

  let text = "";
  grouped.forEach((count, keyStr) => {
    let [n, r, t] = JSON.parse(keyStr);
    let found = ITEMS.find(it => cleanTextOnly(it.text) === t);
    let l = (found && found.link) ? cleanTextOnly(found.link) : "";
    let countStr = count > 1 ? ` ×${count}` : "";
    let linkStr = l ? `\n  URL: ${l}` : "";
    
    text += `${n}\n【${r}】 ${t}${countStr}${linkStr}\n\n`;
  });

  if(!text.trim()){ alert("コピー対象がありません"); return; }
  navigator.clipboard.writeText(text.trim()).then(() => alert("コピーしました！（最新URLも反映済）"));
};

/* バックアップ・インポート */
backupBtn.onclick = async () => {
  const data = {
    gachaCategories,
    currentGacha,
    playerNames,
    historyPlayers,
    itemsData: {},
    historyData: {},
    probsData: {}
  };
  for (let cat of gachaCategories) {
    data.itemsData[cat] = await loadFromDB("gacha_ITEMS_" + cat);
    data.historyData[cat] = await loadFromDB("gacha_history_" + cat);
    data.probsData[cat] = await loadFromDB("gacha_probs_" + cat);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gacha_backup_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".json";
  a.click();
  URL.revokeObjectURL(url);
  alert("全ガチャデータ（確率設定含む）のバックアップをダウンロードしました！");
};

importBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (confirm("現在の全データを上書きしてインポートしますか？")) {
          if (data.gachaCategories) {
            gachaCategories = data.gachaCategories;
            currentGacha = data.currentGacha || gachaCategories[0];
            playerNames = data.playerNames || [];
            historyPlayers = data.historyPlayers || [];

            await saveToDB("gacha_categories", gachaCategories);
            await saveToDB("gacha_currentCategory", currentGacha);
            await saveToDB("gacha_playerNames", playerNames);
            await saveToDB("gacha_historyPlayers", historyPlayers);

            for (let cat of gachaCategories) {
              if (data.itemsData && data.itemsData[cat]) await saveToDB("gacha_ITEMS_" + cat, data.itemsData[cat]);
              if (data.historyData && data.historyData[cat]) await saveToDB("gacha_history_" + cat, data.historyData[cat]);
              if (data.probsData && data.probsData[cat]) await saveToDB("gacha_probs_" + cat, data.probsData[cat]);
            }
          } else {
            ITEMS = data.ITEMS || [];
            history = data.history || [];
            await saveToDB("gacha_ITEMS_" + currentGacha, ITEMS);
            await saveToDB("gacha_history_" + currentGacha, history);
          }
          alert("インポートが完了しました！");
          location.reload();
        }
      } catch (err) {
        alert("インポートに失敗しました。ファイルが正しい形式か確認してください。");
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

/* ---------------------------------------------------------

   --------------------------------------------------------- */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const pwaInstruction = document.getElementById('pwaInstruction');
    
    if (isiOS) {
      pwaInstruction.innerHTML = `
        <b>【iPhone / iPad での設定手順】</b><br><br>
        1. 画面下部（または上部）の「<b>共有ボタン (↑ と □ のアイコン)</b>」をタップ<br>
        2. メニューから「<b>ホーム画面に追加</b>」をタップ<br>
        3. 右上の「<b>追加</b>」をタップ<br><br>
        これでホーム画面からアプリ感覚（オフライン可能）で起動できるようになります！
      `;
    } else {
      pwaInstruction.innerHTML = `
        <b>【Android / PC 等での設定手順】</b><br><br>
        ブラウザの「<b>メニュー(3点リーダー ⋮ )</b>」または「<b>共有マーク ( ↑ と □ )</b>」をタップし、<br>
        「<b>アプリをインストール</b>」または「<b>ホーム画面に追加</b>」を選択してください。
      `;
    }
    document.getElementById('pwaModal').style.display = 'flex';
  }
});

document.getElementById('closePwaBtn').onclick = () => {
  document.getElementById('pwaModal').style.display = 'none';
};
