<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バリエーションダイス</title>
    <style>
        /* テーマごとのカラー定義（デフォルト：ピンク） */
        :root {
            --bg-main: #fdf2f8;
            --card-bg: #ffffff;
            --text-main: #4a3e3d;
            --text-sub: #8c7a78;
            --border-color: #fbcfe8;
            
            --primary: #f472b6;
            --primary-hover: #ec4899;
            --primary-light: #fce7f3;
            
            --accent: #db2777;
            --shadow: rgba(244, 114, 182, 0.15);
        }

        /* 画面上で切り替わる各テーマクラス */
        body.theme-pink {
            --bg-main: #fdf2f8;
            --card-bg: #ffffff;
            --text-main: #4a3e3d;
            --text-sub: #8c7a78;
            --border-color: #fbcfe8;
            --primary: #f472b6;
            --primary-hover: #ec4899;
            --primary-light: #fce7f3;
            --accent: #db2777;
            --shadow: rgba(244, 114, 182, 0.15);
        }

        body.theme-purple {
            --bg-main: #faf5ff;
            --card-bg: #ffffff;
            --text-main: #3b2d54;
            --text-sub: #7a6899;
            --border-color: #e9d5ff;
            --primary: #c084fc;
            --primary-hover: #a855f7;
            --primary-light: #f3e8ff;
            --accent: #9333ea;
            --shadow: rgba(192, 132, 252, 0.15);
        }

        body.theme-aqua {
            --bg-main: #f0f9ff;
            --card-bg: #ffffff;
            --text-main: #234253;
            --text-sub: #5d7e91;
            --border-color: #bae6fd;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --primary-light: #e0f2fe;
            --accent: #0284c7;
            --shadow: rgba(56, 189, 248, 0.15);
        }

        body.theme-white {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary: #64748b;
            --primary-hover: #475569;
            --primary-light: #f1f5f9;
            --accent: #0f172a;
            --shadow: rgba(100, 116, 139, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin: 0 0 4px 0;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        /* 説明文（h5）の中央揃え設定 */
        h5 {
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-sub);
        }

        /* 画面上部のカラーチェンジャー */
        .color-palette {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 10px var(--shadow);
            margin-bottom: 4px;
        }

        .palette-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff;
            outline: 2px solid transparent;
            transition: transform 0.2s, outline-color 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            outline-color: var(--primary);
        }

        /* ナチュラルなカードスタイル */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px var(--shadow);
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ダイス表示枠 */
        .dice-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            background: var(--primary-light);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: background-color 0.3s;
        }

        .dice-type-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .dice-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            min-height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        .dice-value.rolling {
            animation: bounce 0.12s infinite alternate;
            opacity: 0.8;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* ボタンデザイン */
        .roll-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 14px;
        }

        .roll-btn:hover {
            background: var(--primary-hover);
        }

        .roll-btn:active {
            transform: scale(0.98);
        }

        /* モード切り替えボタン */
        .dice-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        @media (max-width: 400px) {
            .dice-selector { grid-template-columns: 1fr; }
        }

        .mode-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            background: var(--primary-light);
        }

        .mode-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* カスタム入力欄 */
        .custom-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .sub-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* 履歴表示 */
        .history-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .history-item {
            background: var(--primary-light);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
            color: var(--text-main);
        }

        .history-item strong {
            color: var(--accent);
        }
    </style>
</head>
<body class="theme-pink">

<div class="container">
    <h1>🎲 バリエーションダイス！</h1>

    <h5>🎲 ダイスの種類を選んで振ってね！カスタマイズもできるぞ！</h5>

    <!-- 画面上でカラーを切り替えるエリア -->
    <div class="color-palette">
        <span class="palette-title">テーマカラー：</span>
        <div class="color-dot active" style="background: #f472b6;" onclick="setTheme('pink', this)" title="ピンク"></div>
        <div class="color-dot" style="background: #c084fc;" onclick="setTheme('purple', this)" title="パープル"></div>
        <div class="color-dot" style="background: #38bdf8;" onclick="setTheme('aqua', this)" title="アクアブルー"></div>
        <div class="color-dot" style="background: #94a3b8;" onclick="setTheme('white', this)" title="ナチュラル"></div>
    </div>

    <!-- メインディスプレイ -->
    <div class="card">
        <div class="dice-display">
            <div id="dice-type-title" class="dice-type-title">通常 (1〜6)</div>
            <div id="dice-value" class="dice-value">🎲</div>
        </div>
        <button id="roll-btn" class="roll-btn" onclick="rollCurrentDice()">ダイスを振る</button>
    </div>

    <!-- ダイス選択 -->
    <div class="card">
        <div class="card-title">🎲ダイスの種類</div>
        <div class="dice-selector">
            <button class="mode-btn active" onclick="setPreset('standard')">🎲 通常 (1〜6)</button>
            <button class="mode-btn" onclick="setPreset('direction')">🧭 8方位 (移動)</button>
            <button class="mode-btn" onclick="setPreset('happening')">🌀 ハプニング (移動)</button>
            <button class="mode-btn" onclick="setPreset('risk')">⚖️ リスク＆リターン</button>
            <button class="mode-btn" onclick="setPreset('math')">✖️&➗演算 (計算)</button>
            <button class="mode-btn" onclick="setPreset('party')">🎉パーティー (指示)</button>
        </div>
    </div>

    <!-- カスタムダイス -->
    <div class="card">
        <div class="card-title">🧰オリジナルダイスを作る</div>
        <div class="custom-inputs">
            <input type="text" id="custom-title" placeholder="ダイスの名前 (例: 罰ゲームダイス)" value="マイ・ダイス">
            <input type="text" id="custom-options" placeholder="出目をカンマ区切りで入力 (例: 歌う, 1休, 踊る, 秘密告白)">
            <div class="sub-text">※項目をカンマ( , )で区切って入力すると、自分だけのダイスが作れます。</div>
            <button class="mode-btn" style="justify-content: center; background: var(--primary); color: white; border: none; margin-top: 2px;" onclick="setCustomDice()">
                このカスタムダイスを使う
            </button>
        </div>
    </div>

    <!-- 履歴 -->
    <div class="card">
        <div class="card-title">📜 履歴（直近5回）</div>
        <div id="history-list" class="history-list">
            <span class="sub-text">まだ履歴はありません</span>
        </div>
    </div>
</div>

<script>
    // 画面上でのテーマ切り替え
    function setTheme(themeName, el) {
        document.body.className = 'theme-' + themeName;
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
        if (el) el.classList.add('active');
    }

    // プリセットダイスのデータ
    const presets = {
        standard: {
            title: "通常 (1〜6)",
            options: ["1", "2", "3", "4", "5", "6"]
        },
        direction: {
            title: "8方位ダイス",
            options: ["⬆️ 北", "⬇️ 南", "➡️ 東", "⬅️ 西", "↗️ 北東", "↖️ 北西", "↘️ 南東", "↙️ 南西"]
        },
        happening: {
            title: "ハプニングダイス",
            options: [
                "🔄 隣の人と位置チェンジ", 
                "🏃 全員1マス進む", 
                "⏸️ 1回休み", 
                "✊　皆でじゃんけん！勝ったやつはノリノリでワンフレーズ歌おう！", 
                "🎁 もう一回振る", 
                "☕ 何事もなし"
            ]
        },
        risk: {
            title: "リスク＆リターン",
            options: ["🔥 ＋6 進む", "🔥 ＋10 進む", "Σ੧(・・ ✿)誰かを10マスまで移動できる","🚶‍➡️ 5 戻る", "🚶‍➡️ 4 戻る", "🚶‍➡️ 2 戻る", "変化なし", "💥 スタートへ戻る！"]
        },
        math: {
            title: "演算ダイス",
            options: ["＋1", "＋3", "×2", "−2", "÷2 (切り捨て)", "ゼロになる"]
        },
        party: {
            title: "パーティー指示ダイス",
            options: [
                "🐱 次のターンまで語尾に「にゃー」をつける", 
                "🐕　次のターンまで語尾に「ワン！」をつける", 
                "🚫 次のターンまで「英語禁止」", 
                "🚫 次のターンまで「日本語禁止」", 
　　　　　　　　　　"💪 さぁ筋トレだ！",
                "🦵 片足立ちで次のターンを迎える", 
　　　　　　　　　　"👤ジェスチャーで食べたい物を伝える", 
                "🗣️ 早口言葉に挑戦", 
                "🤝 隣の人を褒める", 
                "😇 ノープラン（セーフ）"
            ]
        }
    };

    let currentDice = presets.standard;
    let isRolling = false;
    let history = [];

    function setPreset(key) {
        if (isRolling) return;
        currentDice = presets[key];
        document.getElementById('dice-type-title').textContent = currentDice.title;
        document.getElementById('dice-value').textContent = "🎲";
        
        const btns = document.querySelectorAll('.dice-selector .mode-btn');
        btns.forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function setCustomDice() {
        if (isRolling) return;
        const titleInput = document.getElementById('custom-title').value.trim() || "カスタムダイス";
        const optionsInput = document.getElementById('custom-options').value;
        
        const options = optionsInput.split(/[,、]/).map(s => s.trim()).filter(s => s.length > 0);

        if (options.length < 2) {
            alert("出目をカンマ( , )区切りで2つ以上入力してください！");
            return;
        }

        currentDice = {
            title: titleInput,
            options: options
        };

        document.getElementById('dice-type-title').textContent = currentDice.title;
        document.getElementById('dice-value').textContent = "🎲";
        
        const btns = document.querySelectorAll('.dice-selector .mode-btn');
        btns.forEach(btn => btn.classList.remove('active'));

        alert(`「${titleInput}」を設定しました！`);
    }

    function rollCurrentDice() {
        if (isRolling) return;
        isRolling = true;

        const valEl = document.getElementById('dice-value');
        const rollBtn = document.getElementById('roll-btn');
        
        valEl.classList.add('rolling');
        rollBtn.disabled = true;
        rollBtn.style.opacity = "0.6";

        let count = 0;
        const maxRolls = 12;
        const interval = setInterval(() => {
            const randomTmp = currentDice.options[Math.floor(Math.random() * currentDice.options.length)];
            valEl.textContent = randomTmp;
            count++;

            if (count >= maxRolls) {
                clearInterval(interval);
                const finalResult = currentDice.options[Math.floor(Math.random() * currentDice.options.length)];
                valEl.textContent = finalResult;
                valEl.classList.remove('rolling');
                
                rollBtn.disabled = false;
                rollBtn.style.opacity = "1";
                isRolling = false;

                addHistory(currentDice.title, finalResult);
            }
        }, 60);
    }

    function addHistory(title, result) {
        history.unshift({ title: title, result: result });
        if (history.length > 5) history.pop();

        const historyEl = document.getElementById('history-list');
        historyEl.innerHTML = history.map(item => `
            <div class="history-item">
                ${item.title}: <strong>${item.result}</strong>
            </div>
        `).join('');
    }
</script>
</body>
</html>
