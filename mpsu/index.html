<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マップすごろくツール</title>
    <style>
        :root {
            --bg-color: #fff0f5;
            --panel-bg: #ffffff;
            --text-color: #4a4a4a;
            --border-color: #ffc0cb;
            --primary: #ff69b4;
            --primary-hover: #ff1493;
            --accent: #db7093;
            --accent-start: #32cd32;
            --accent-goal: #ff4500;
            --cell-wall: #ccb0b0;
            --green-btn: #10b981;
            --green-btn-hover: #059669;
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        h1 { font-size: 1.4rem; text-align: center; color: var(--accent); margin-bottom: 15px; }
        
        /* 1, 2, 3 のパネルを3列配置（画面が狭いときは自動縮小・折返し） */
        .layout-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
        @media (max-width: 768px) { .layout-top { grid-template-columns: 1fr; } }

        .panel { background: var(--panel-bg); padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3); border: 1px solid rgba(255, 192, 203, 0.5); display: flex; flex-direction: column; justify-content: space-between; }
        h2 { font-size: 0.95rem; margin-top: 0; margin-bottom: 10px; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; color: var(--accent); display: flex; align-items: center; gap: 4px; }
        
        .section-num { font-size: 1.35rem; font-weight: bold; color: var(--primary); line-height: 1; }

        .control-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        input, select, button { padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        
        /* 操作系 */
        .game-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-width: 200px; margin: 0 auto 8px auto; }
        .d-pad-btn { background: #ffb6c1; }
        .d-pad-btn:hover { background: #ff69b4; }
        
        .btn-green { background: var(--green-btn); }
        .btn-green:hover { background: var(--green-btn-hover); }

        .btn-misc { grid-column: span 3; }

        /* 補足案内テキスト */
        .sub-note { font-size: 0.75rem; color: #777; text-align: center; margin-top: 4px; font-weight: bold; }

        /* マップ表示エリア（大きく確保） */
        .map-container-wrapper { width: 100%; min-height: 450px; overflow: auto; border: 2px solid var(--border-color); border-radius: 12px; background: #ffffff; padding: 15px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; }
        .grid { display: grid; gap: 4px; background: #ffe4e1; border: 4px solid #ffe4e1; border-radius: 8px; width: 100%; max-width: 800px; }
        .cell { background: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; aspect-ratio: 1; font-size: clamp(0.8rem, 2.5vw, 1.2rem); border-radius: 4px; position: relative; }
        .cell.wall { background-color: var(--cell-wall); color: #ffffff; }
        .cell.start { background-color: var(--accent-start) !important; color: #ffffff; }
        .cell.goal { background-color: var(--accent-goal) !important; color: #ffffff; }
        
        .badge { position: absolute; top: 1px; left: 1px; font-size: 0.55rem; padding: 1px 2px; border-radius: 3px; color: white; background: rgba(0,0,0,0.3); pointer-events: none; }
        
        /* コマ用画像のスタイル */
        .player-icon { width: 75%; height: 75%; object-fit: contain; pointer-events: none; }

        .btn-col { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 10px; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(219, 112, 147, 0.9); color: #fff; padding: 10px 20px; border-radius: 25px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>マップすごろくツール</h1>

    <div class="layout-top">
        <!-- 1. マップ設定 -->
        <div class="panel">
            <div>
                <h2><span class="section-num">1.</span> マップ設定</h2>
                <div class="control-group">
                    <label>横幅(2-30)</label>
                    <input type="number" id="input-cols" value="8" min="2" max="30">
                    <label>縦幅(2-30)</label>
                    <input type="number" id="input-rows" value="8" min="2" max="30">
                    <button id="btn-apply-size">サイズを適用</button>
                    <button id="btn-random-pos" class="btn-green" style="margin-top:5px;">S/Gをランダム配置</button>
                </div>
            </div>
        </div>

        <!-- 2. 操作モード・移動 -->
        <div class="panel">
            <div>
                <h2><span class="section-num">2.</span> 操作モード・移動</h2>
                <select id="select-mode" style="width: 100%; margin-bottom: 10px;">
                    <option value="move">📍 移動 (クリックでも可)</option>
                    <option value="wall">🚧 障害物</option>
                    <option value="start">🟢 スタート！配置</option>
                    <option value="goal">🔴 ゴール！配置</option>
                    <option value="text">✏️ 文字を書く</option>
                </select>
                
                <div class="game-controls">
                    <button class="d-pad-btn" onclick="movePlayer(0, -1)">←</button>
                    <button class="d-pad-btn" onclick="movePlayer(-1, 0)">↑</button>
                    <button class="d-pad-btn" onclick="movePlayer(0, 1)">→</button>
                    <button class="d-pad-btn" style="grid-column: 2;" onclick="movePlayer(1, 0)">↓</button>
                    <button class="btn-misc btn-green" onclick="undoMove()">↩️ 戻る</button>
                    <button class="btn-misc" style="background:#ef4444;" onclick="confirmResetPlayer()">🔄 現在地リセット</button>
                    <button class="btn-misc btn-green" onclick="document.getElementById('input-player-img').click()">コマをカスタマイズ</button>
                    <input type="file" id="input-player-img" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                </div>
                <div class="sub-note">※下のマップをタップでも操作できるよ！</div>
            </div>
        </div>

        <!-- 3. 画像保存・コピー -->
        <div class="panel" style="text-align: center;">
            <div>
                <h2><span class="section-num">3.</span> 保存・コピー</h2>
                <div style="font-weight: bold; margin: 15px 0 10px 0;">👟 歩数: <span id="step-count" style="font-size: 1.2rem; color: var(--primary);">0</span></div>
            </div>
            <div class="btn-col">
                <button id="btn-download" style="background: #0ea5e9;">💾 PNG画像で保存</button>
                <button id="btn-copy" class="btn-green">📋 クリップボードにコピー</button>
            </div>
        </div>
    </div>

    <!-- マップ表示エリア（大きく配置） -->
    <div class="map-container-wrapper">
        <div id="grid-container" style="background:#ffffff; padding:10px; width: 100%; display: flex; justify-content: center;">
            <div id="grid" class="grid"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    let cols = 8, rows = 8;
    let gridData = [], textData = [];
    let startPos = { r: 0, c: 0 }, goalPos = { r: 7, c: 7 }, currentPos = { r: 0, c: 0 };
    let moveHistory = []; 
    let stepCount = 0;
    let playerIconSrc = null; // カスタムコマ画像用データ

    const gridEl = document.getElementById('grid');
    const stepCountEl = document.getElementById('step-count');

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function initMap() {
        cols = parseInt(document.getElementById('input-cols').value) || 8;
        rows = parseInt(document.getElementById('input-rows').value) || 8;
        gridData = Array(rows).fill(0).map(() => Array(cols).fill(0));
        textData = Array(rows).fill("").map(() => Array(cols).fill(""));
        startPos = { r: 0, c: 0 }; goalPos = { r: rows - 1, c: cols - 1 };
        resetPlayer();
    }

    function resetPlayer() {
        currentPos = { ...startPos };
        moveHistory = [];
        stepCount = 0;
        renderGrid();
    }

    // リセット前の確認メッセージ処理
    function confirmResetPlayer() {
        if (confirm("本当にリセットしますか？")) {
            resetPlayer();
            showToast("現在地をリセットしました！");
        }
    }

    function movePlayer(dr, dc) {
        const nr = currentPos.r + dr;
        const nc = currentPos.c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && gridData[nr][nc] !== 1) {
            moveHistory.push({ ...currentPos });
            currentPos = { r: nr, c: nc };
            stepCount++;
            renderGrid();
        }
    }

    function undoMove() {
        if (moveHistory.length > 0) {
            currentPos = moveHistory.pop();
            stepCount = Math.max(0, stepCount - 1);
            renderGrid();
        }
    }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                playerIconSrc = evt.target.result;
                renderGrid();
                showToast("コマ画像を変更しました！");
            };
            reader.readAsDataURL(file);
        }
    }

    function renderGrid() {
        gridEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        gridEl.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (gridData[r][c] === 1) cell.classList.add('wall');
                if (r === startPos.r && c === startPos.c) { cell.classList.add('start'); cell.innerHTML = '<span class="badge">スタート！</span>'; }
                if (r === goalPos.r && c === goalPos.c) { cell.classList.add('goal'); cell.innerHTML = '<span class="badge">ゴール！</span>'; }
                
                if (r === currentPos.r && c === currentPos.c) {
                    if (playerIconSrc) {
                        cell.innerHTML += `<img src="${playerIconSrc}" class="player-icon" alt="コマ">`;
                    } else {
                        cell.innerHTML += '📍';
                    }
                }
                if (textData[r][c]) cell.innerHTML += textData[r][c];

                cell.onclick = () => handleCellClick(r, c);
                gridEl.appendChild(cell);
            }
        }
        stepCountEl.textContent = stepCount;
    }

    function handleCellClick(r, c) {
        const mode = document.getElementById('select-mode').value;
        if (mode === 'move') {
            if (gridData[r][c] === 1) return;
            moveHistory.push({ ...currentPos });
            currentPos = { r, c };
            stepCount++;
        } else if (mode === 'wall') {
            if ((r === startPos.r && c === startPos.c) || (r === goalPos.r && c === goalPos.c)) return;
            gridData[r][c] = gridData[r][c] === 1 ? 0 : 1;
        } else if (mode === 'start') {
            if (r === goalPos.r && c === goalPos.c) return;
            startPos = { r, c };
            if (moveHistory.length === 0) currentPos = { r, c };
        } else if (mode === 'goal') {
            if (r === startPos.r && c === startPos.c) return;
            goalPos = { r, c };
        } else if (mode === 'text') {
            if (gridData[r][c] === 1) return;
            const t = prompt("文字を入力:", textData[r][c]);
            if (t !== null) textData[r][c] = t;
        }
        renderGrid();
    }

    document.getElementById('btn-apply-size').onclick = () => { initMap(); showToast("サイズ変更しました！"); };
    document.getElementById('btn-random-pos').onclick = () => {
        startPos = { r: Math.floor(Math.random()*rows), c: Math.floor(Math.random()*cols) };
        goalPos = { r: Math.floor(Math.random()*rows), c: Math.floor(Math.random()*cols) };
        resetPlayer();
        showToast("S/Gをランダム配置しました！");
    };

    // 画像キャプチャ処理
    function captureMap(callback) {
        const target = document.getElementById('grid-container');
        html2canvas(target, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
            callback(canvas);
        }).catch(() => showToast("画像の生成に失敗しました"));
    }

    // PNG保存
    document.getElementById('btn-download').onclick = () => {
        showToast("画像を生成中...");
        captureMap(canvas => {
            const a = document.createElement('a');
            a.download = 'grid-map.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
            showToast("画像を保存しました！");
        });
    };

    // クリップボードへコピー
    document.getElementById('btn-copy').onclick = () => {
        if (!navigator.clipboard || !window.ClipboardItem) {
            showToast("お使いの環境ではコピーに対応していません");
            return;
        }
        showToast("画像を生成中...");
        captureMap(canvas => {
            canvas.toBlob(blob => {
                try {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]).then(() => {
                        showToast("クリップボードにコピーしました！");
                    }).catch(() => showToast("コピーに失敗しました"));
                } catch (e) {
                    showToast("コピーが制限されています");
                }
            });
        });
    };

    initMap();
</script>
</body>
</html>
